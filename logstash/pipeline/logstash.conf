input {
  tcp {
    port => 5044
    codec => json
  }
  beats {
    port => 5045
  }
}

filter {
  if [zeek_log_type] {
    mutate {
      add_field => {
        "[event][module]" => "zeek"
        "[event][dataset]" => "zeek.%{zeek_log_type}"
        "[observer][type]" => "nsm"
        "[observer][vendor]" => "Zeek"
      }
    }

    if [ts] {
      date {
        match => ["ts", "UNIX"]
        target => "@timestamp"
      }
    }

    if [id][orig_h] {
      mutate {
        add_field => { "[source][ip]" => "%{[id][orig_h]}" }
      }
    }

    if [id][resp_h] {
      mutate {
        add_field => { "[destination][ip]" => "%{[id][resp_h]}" }
      }
    }

    if [id][orig_p] {
      mutate {
        add_field => { "[source][port]" => "%{[id][orig_p]}" }
      }
    }

    if [id][resp_p] {
      mutate {
        add_field => { "[destination][port]" => "%{[id][resp_p]}" }
      }
    }

    mutate {
      convert => {
        "[source][port]" => "integer"
        "[destination][port]" => "integer"
      }
    }
  }

  # Add geoip for source IPs
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }
  
  # Add timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
}

output {
  if [zeek_log_type] {
    elasticsearch {
      hosts => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => true
      cacert => "/usr/share/elasticsearch/config/certificates/ca/ca.crt"
      index => "zeek-%{+YYYY.MM.dd}"
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => true
      cacert => "/usr/share/elasticsearch/config/certificates/ca/ca.crt"
      index => "logs-%{+YYYY.MM.dd}"
      ilm_enabled => true
      ilm_rollover_alias => "logs"
      ilm_pattern => "000001"
      ilm_policy => "logs-policy"
    }
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
