services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: finallab-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "${ELASTIC_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:SecurePassword123! http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"green\"|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 15

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: finallab-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICETOKEN}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    volumes:
      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSI http://localhost:5601 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15

  misp-db:
    image: mariadb:11.4
    container_name: finallab-misp-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MISP_DB_NAME}
      MARIADB_USER: ${MISP_DB_USER}
      MARIADB_PASSWORD: ${MISP_DB_PASSWORD}
    volumes:
      - ./volumes/misp-db-fresh:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 15

  misp-redis:
    image: redis:7-alpine
    container_name: finallab-misp-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:${MISP_VERSION}
    container_name: finallab-misp-modules
    restart: unless-stopped
    ports:
      - "6666:6666"
    depends_on:
      misp-db:
        condition: service_healthy

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:${MISP_VERSION}
    container_name: finallab-misp-core
    restart: unless-stopped
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy
      misp-modules:
        condition: service_started
    ports:
      - "${MISP_HTTP_PORT}:80"
      - "${MISP_HTTPS_PORT}:443"
    environment:
      BASE_URL: ${MISP_BASE_URL}
      MYSQL_HOST: misp-db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MISP_DB_USER}
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD}
      MYSQL_DATABASE: ${MISP_DB_NAME}
      REDIS_HOST: misp-redis
      REDIS_PORT: 6379
      ENABLE_REDIS_EMPTY_PASSWORD: "true"
      SMTP_FQDN: mailhog
      SMTP_PORT: 1025
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL}
      ADMIN_ORG: ${MISP_ADMIN_ORG}
      ADMIN_ORG_UUID: ${MISP_ADMIN_ORG_UUID}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD}
      GPG_PASSPHRASE: ${MISP_GPG_PASSPHRASE}
      MISP_EMAIL: ${MISP_ADMIN_EMAIL}
      MISP_CONTACT: ${MISP_ADMIN_EMAIL}
      MISP_MODULES_FQDN: ${MISP_MODULES_FQDN}
      ENABLE_DB_SETTINGS: "true"
      AUTOCONF_GPG: "true"
      AUTOCONF_ADMIN_KEY: "true"
      AUTOGEN_ADMIN_KEY: "true"
      ENABLE_BACKGROUND_UPDATES: "true"
      PROXY_ENABLE: "false"
      DEBUG: "0"
      NUM_WORKERS_DEFAULT: "2"
      NUM_WORKERS_PRIO: "2"
      NUM_WORKERS_EMAIL: "1"
      NUM_WORKERS_UPDATE: "1"
      NUM_WORKERS_CACHE: "2"
      CRON_PULLALL: "86400"
      CRON_PUSHALL: "86400"
      CUSTOM_PATH: /custom
    volumes:
      - ./config/misp:/var/www/MISP/app/Config
      - ./volumes/misp-logs:/var/www/MISP/app/tmp/logs
      - ./volumes/misp-files:/var/www/MISP/app/files
      - ./volumes/misp-gnupg:/var/www/MISP/.gnupg
      - ./scripts:/custom/files:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -ks https://localhost/users/heartbeat >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20

  thehive:
    image: strangebee/thehive:${THEHIVE_VERSION}
    container_name: finallab-thehive
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      misp-core:
        condition: service_healthy
    ports:
      - "${THEHIVE_PORT}:9000"
    environment:
      THEHIVE_SECRET: ${THEHIVE_SECRET}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      MISP_API_KEY: ${MISP_API_KEY}
      JAVA_OPTS: ${THEHIVE_JAVA_OPTS}
    volumes:
      - ./config/thehive/application.conf:/etc/thehive/application.conf:ro
      - ./config/thehive/logback.xml:/etc/thehive/logback.xml:ro
      - /tmp/thehive-data:/data
      - /tmp/thehive-files:/opt/thehive/files
      - /tmp/thehive-logs:/opt/thehive/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSI http://localhost:9000 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: finallab-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT}:8025"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default

volumes:
  es_data:
    driver: local
  thehive_data:
    driver: local
